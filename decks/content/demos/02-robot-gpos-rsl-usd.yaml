id: 02-robot-gpos-rsl-usd
section: metaverse
order: 555
footer: OPC UA demos — Robot with GPOS/RSL and USD
slides:
  - layout: demo
    title: Demo 2 — Robot with GPOS/RSL and USD
    kicker: One robot server composes Robotics, RSL, GPOS and OpenUSD
    state: master
    see:
      - Two mobile robots move in the OpenUSD viewport
      - RSL frames drive robot-relative transforms
      - GPOS values drive global location attributes
      - The connector uses no robot-specific bridge
    parts:
      - MinimalRobotServer publishes the robot cell
      - Opc.Ua.Positioning supplies RSL and GPOS
      - Opc.Ua.OpenUsd.Connector renders the stage
      - OpenUSD viewer shows live subscribed values
    run:
      - pwsh decks\demos\02-robot-gpos-rsl-usd\run-demo.ps1
    proves: >-
      OpenUSD bindings and scene materialization can make a companion-model robot cell visible
      directly from OPC UA, with RSL and GPOS providing the pose context.
    notes: |
      Start by naming the three companion-model layers in the same server: OPC 40010 Robotics
      describes the robot cell, OPC 10000-210 RSL gives the relative frame chain, and OPC
      10000-211 GPOS gives the global position. Then point at the viewport. The connector is
      generic; it discovers the OpenUSD representations under the Server object and streams
      subscribed OPC UA values into the stage. The important claim is not that a robot can be
      drawn. The claim is that the model, the spatial frame chain, the global position, and the
      visual binding are all browseable OPC UA content, so another client can discover the same
      contract without a private robot-viewer bridge.

  - layout: diagram
    title: What the demo starts
    kicker: One Server, one viewer, and every value the picture moves by is a browseable Node
    cols: 12
    rows: 6
    nodes:
      - {id: srv, x: 0.2, y: 1.1, w: 3.6, h: 1.4, text: "MinimalRobotServer", style: primary, font_size: 12, lines: ["opc.tcp :62830", "two mobile six-axis robots"]}
      - {id: rsl, x: 4.8, y: 0.5, w: 3.0, h: 1.0, text: "RSL frame chain", style: green, font_size: 11, lines: ["Part 211 spatial"]}
      - {id: gpos, x: 4.8, y: 1.9, w: 3.0, h: 1.0, text: "GPOS", style: green, font_size: 11, lines: ["Part 210 global position"]}
      - {id: usd, x: 4.8, y: 3.3, w: 3.0, h: 1.0, text: "OpenUSD binding", style: purple, font_size: 11, lines: ["representations"]}
      - {id: view, x: 8.8, y: 1.9, w: 3.0, h: 1.4, text: "Connector viewer", style: accent, font_size: 12, lines: ["subscribes, draws the stage"]}
    arrows:
      - {from: srv, to: rsl}
      - {from: srv, to: gpos}
      - {from: srv, to: usd}
      - {from: gpos, to: view, label: "subscription"}
    captions:
      - {x: 0, y: 5.0, w: 12, text: "The viewer is generic — it discovers the bindings rather than knowing this robot", center: true}
    notes: |
      Show this before the picture moves, so the audience knows what to watch. Three things sit under
      the Server object and all three are ordinary browseable content: the RSL frame chain, the GPOS
      global position, and the OpenUSD representations that bind them to geometry.

      The viewer holds no knowledge of this robot. It discovers the representations, subscribes to the
      values they name, and streams them into the stage. That is the claim worth making — not that a
      robot can be drawn, but that another client could reach the same contract with no private bridge.