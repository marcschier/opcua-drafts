id: 10-ai-model-loading
section: metaverse
order: 535
footer: OPC UA — AI model loading
slides:
  - layout: demo
    title: "Demo 10 — AI model loading"
    kicker: Invoke a model and keep the provenance
    state: branch
    see:
      - Local test backend answers model calls
      - Server publishes deployments and sources
      - Client invokes inline, transfer and async paths
      - Output reports which model answered
    parts:
      - "`samples\\AI\\ModelManagementServer`"
      - "`samples\\AI\\ModelManagementClient`"
      - "`samples\\AI\\verify_backend.py`"
      - "`src\\Opc.Ua.AI`, `.Client`, `.Inference`, `.Server`"
    run:
      - "pwsh decks\\demos\\10-ai-model-loading\\run-demo.ps1 -StackRoot <ai-models worktree>"
    proves: A model call can be OPC UA while the execution location stays an implementation detail.
    notes: |
      This demo needs the `fork/marcschier/vision-guided-picking` branch and does contain a runnable
      sample. The script starts the branch's HTTP verification backend, starts the OPC UA Server and
      runs the sample client. Be clear about what is real: the address space, Methods, provenance,
      transfer path, async job path and OpenAI-compatible bridge are implemented. The backend is a
      test double and the learning loop is simulated; it does not train or promote a real model.
      The proof point is `ModelUsed` and the references that let an auditor trace an answer later.

      The branch name is about vision because the AI work now sits on the same line of development —
      the visual inspection agent is what needs inference. The AI libraries live under
      `src/Opc.Ua.AI*` and the sample under `samples/AI`. That branch is moving quickly, so re-check
      the paths before presenting; the Vision samples on it do not currently build, though the AI
      sample this demo uses does.

  - layout: diagram
    title: What the demo starts
    kicker: Three processes, and the answer arrives with the model that produced it attached
    cols: 12
    rows: 6
    nodes:
      - {id: cli, x: 0.3, y: 1.9, w: 3.0, h: 1.3, text: "ModelManagementClient", style: accent, font_size: 11, lines: ["Invoke · BeginTransfer · InvokeAsync"]}
      - {id: srv, x: 4.4, y: 1.9, w: 3.4, h: 1.3, text: "ModelManagementServer", style: primary, font_size: 12, lines: ["opc.tcp :62640"]}
      - {id: back, x: 8.9, y: 1.9, w: 2.8, h: 1.3, text: "verify_backend.py", style: muted, font_size: 11, lines: ["http :5273 · test double"]}
      - {id: prov, x: 4.4, y: 4.0, w: 3.4, h: 1.1, text: "Provenance", style: green, font_size: 11, lines: ["UsesModel · ModelUsed · FinishReason"]}
    arrows:
      - {from: cli, to: srv, label: "Method call"}
      - {from: srv, to: back, label: "OpenAI-compatible"}
      - {from: srv, to: prov}
    captions:
      - {x: 0, y: 5.4, w: 12, text: "Where inference runs is an implementation detail; what answered is not", center: true}
    notes: |
      Three processes and one claim. The client makes an ordinary OPC UA Method call; the Server
      reaches an inference backend over an OpenAI-compatible REST API; the answer comes back with
      `ModelUsed` and the references an auditor needs to trace it later.

      Be precise about what is real. The address space, the Methods, the transfer path, the async job
      path and the provenance chain are implemented. The backend is a test double so the OPC UA path
      is runnable without a cloud account, and the learning loop is simulated — it does not retrain or
      promote a model. No cloud-vendor SDK is referenced anywhere in the sample.