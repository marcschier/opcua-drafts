id: 06-server-redundancy
section: stack
order: 710
footer: OPC UA — server redundancy
slides:
  - layout: demo
    title: "Demo 6 — server redundancy"
    kicker: Kill the active server during a subscription
    state: master
    see:
      - Three server replicas publish redundancy metadata
      - A managed client subscribes through one endpoint
      - The active replica is stopped by process id
      - Client logs reconnect, failover and data impact
    parts:
      - "`samples\\RedundantServer`"
      - "`samples\\RedundantClient`"
      - "`src\\Opc.Ua.Redundancy.Server`"
      - "`src\\Opc.Ua.Redundancy.Client`"
    run:
      - "pwsh decks\\demos\\06-server-redundancy\\run-demo.ps1"
    proves: Drafts that assume a highly available Server need redundancy metadata, state sharing and client failover.
    notes: |
      This slide is about cost, not magic. A client subscription continues only because the Server
      set publishes redundancy metadata, peers have comparable address spaces, service level gives
      the client a selection signal, shared state lets a standby continue useful values, and the
      managed client has a failover policy. Point out the difference between availability and
      losslessness. The client may log HA OK for preserved state or DATA LOSS for missed samples;
      both are useful because the application sees what happened instead of silently assuming
      continuity.

  - layout: diagram
    title: What the demo starts
    kicker: Three replicas that know about each other, and a client that survives losing the one it is on
    cols: 12
    rows: 6
    nodes:
      - {id: a, x: 0.3, y: 0.5, w: 3.2, h: 1.1, text: "replica-a", style: primary, font_size: 12, lines: ["opc.tcp :62543"]}
      - {id: b, x: 4.4, y: 0.5, w: 3.2, h: 1.1, text: "replica-b", style: pale, font_size: 12, lines: ["opc.tcp :62544"]}
      - {id: c, x: 8.5, y: 0.5, w: 3.2, h: 1.1, text: "replica-c", style: pale, font_size: 12, lines: ["opc.tcp :62545"]}
      - {id: set, x: 4.4, y: 2.4, w: 3.2, h: 1.1, text: "ServerRedundancy", style: green, font_size: 11, lines: ["peers · ServiceLevel"]}
      - {id: cli, x: 4.4, y: 4.2, w: 3.2, h: 1.1, text: "RedundantClient", style: accent, font_size: 12, lines: ["one Session, one Subscription"]}
    arrows:
      - {from: a, to: set}
      - {from: b, to: set}
      - {from: c, to: set}
      - {from: set, to: cli, label: "failover"}
    captions:
      - {x: 0, y: 5.5, w: 12, text: "Kill replica-a and the subscription continues — the client did not reconnect by hand", center: true}
    notes: |
      Each replica is told about the other two through `HA_REDUNDANT_PEERS`, so the redundant set is
      configuration rather than discovery. Every replica publishes the same redundancy information and
      a ServiceLevel the client can compare.

      The moment to point at is the kill. Stop replica-a while the subscription is running: the managed
      client moves to a surviving replica and the monitored items keep reporting, with the subscription
      transferred rather than rebuilt. Nothing in the client code handles that — it is the stack
      honouring Part 4 redundancy, which is the whole claim.