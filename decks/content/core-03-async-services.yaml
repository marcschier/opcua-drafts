id: core-03-async-services
section: core
order: 130
footer: OPC UA — Asynchronous Service Execution
slides:
  - layout: bullets
    title: Why Async Services exists
    kicker: OPC UA cannot say “still working, ask me again”
    bullets:
      - text: "A gateway may not finish before the Client times out"
      - text: "`Bad_Timeout` hides failed versus still running"
      - text: "Retrying can repeat an effect that is already in flight"
      - text: "Ticket Methods solve one case at a time"
      - text: "`Good_CompletesAsynchronously` gives no outcome path"
    takeaway: "The missing contract is one generic way to collect a late Service response."
    notes: |
      The draft's problem section uses gateway certificate management as the concrete example: `ApplyChanges` may fan out to many devices and outlast the Client's `timeoutHint`. In current OPC UA, the Client receives a timeout and cannot know whether the Server failed, is still working, or has already caused a non-idempotent effect. Retrying can therefore be dangerous. Existing mechanisms are partial. `Good_CompletesAsynchronously` says processing will finish later but does not tell the Client how to learn the result. Ticket Methods, such as `StartSigningRequest` and `FinishRequest`, solve one specification's problem privately and cannot apply to a general `Write` or `Call` unless every specification invents its own poll method.

  - layout: table
    title: What it adds
    kicker: One Service and a small discovery model
    table:
      columns: ["Piece", "Kind", "Purpose"]
      widths: [0.35, 0.22, 0.43]
      rows:
        - ["`Complete`", "Service", "Collects a parked response"]
        - ["`DeferralRequestHeaderDataType`", "Header", "Client opts in to deferral"]
        - ["`DeferralResponseHeaderDataType`", "Header", "Carries retry and expiry hints"]
        - ["`AsyncServiceCapabilities`", "Object", "Lists deferrable Services"]
        - ["`DeferredRequestCompletedEventType`", "Event", "Tells a Client to collect"]
        - ["`AuditDeferredRequestEventType`", "Event", "Records the lifecycle"]
        - ["New StatusCodes", "Results", "Unknown, expired, cancelled, busy"]
    notes: |
      The central addition is `Complete`, placed in the Session Service Set beside `Cancel`. It uses the same `requestHandle` that identified the original request, so the Server does not mint a ticket and the Client does not store a cookie. A Client opts in by carrying `DeferralRequestHeaderDataType` in `RequestHeader.additionalHeader`; without that, the Server must answer as it does today because a legacy Client could not collect a parked response. The response header carries `RetryAfter` and `ExpiryTime`, while `AsyncServiceCapabilities` publishes `DeferrableServices`, retry floors and parking limits. The events are not decoration: one lets a Client avoid polling, and the audit event records the moment an effect was authorized and the later moment its outcome became known.

  - layout: code
    title: How it works
    kicker: "`Bad_RequestNotComplete` becomes a retry contract"
    intro: "The original request executes once; `Complete` only collects its response."
    code: |
      Client -> Server: Call(..., requestHandle=42,
                              DeferralRequestHeader)
      Server -> Client: Bad_RequestNotComplete
                         RetryAfter, ExpiryTime
      Client -> Server: Complete(requestHandle=42)
      Server -> Client: Bad_RequestNotComplete, RetryAfter
      Server -> Client: DeferredRequestCompletedEventType(42)
      Client -> Server: Complete(requestHandle=42)
      Server -> Client: original CallResponse or CompleteResponse
    outro: "`Cancel(42)` abandons the answer; it does not promise to undo the work."
    notes: |
      Section 4.4 is the draft in one paragraph, and the flow on the slide follows it. A Server that cannot answer in time parks the request and returns the existing `Bad_RequestNotComplete` with a `RetryAfter` hint. Later `Complete` calls use the same request handle. If work is still executing, the Server returns `Bad_RequestNotComplete` again with a fresh hint and enforces `MinRetryAfter` with `Bad_ServerTooBusy` when a Client polls too fast. When the result is ready, `Complete` returns the original Service response, such as `CallResponse` or `WriteResponse`. If the parked Service itself failed, a `CompleteResponse` carries the deferred service result separately from failures of `Complete` itself.

  - layout: bullets
    title: Lifecycle rules that matter
    kicker: Deferral changes response timing, not authorization or execution
    bullets:
      - text: "Deferral is opt-in per request"
      - text: "The effect is executed once, never by `Complete`"
      - text: "A delivered response is retained for replay until expiry"
      - text: "The parked response belongs to the issuing Session"
      - text: "Reconnect must not weaken `MessageSecurityMode`"
      - text: "Audit `Completed` records the outcome even if nobody collects"
    notes: |
      The lifecycle clauses are the safety story. Admission is decided before the work starts, and a Server reserves parking capacity before an irreversible effect can leave it with no place to store the outcome. The parked request belongs to the issuing Session; another Session gets `Bad_DeferredRequestUnknown`, not a disclosure that a handle exists. A Session may reconnect on a new SecureChannel, but the Server records the SecurityMode under which the request was parked and refuses a weaker channel with `Bad_SecurityModeInsufficient`. Delivery is also replayable until the response deadline, because the Server cannot know whether a transmitted response reached the Client. `Cancel` and expiry discard the answer; the draft explicitly says they do not imply rollback of a distributed effect.

  - layout: bullets
    title: Status and where it lives
    kicker: Errata answering Mantis 10606
    bullets:
      - text: "Version banner: **0.1.0**, dated 2026-08-03"
      - text: "Targets Parts 4 and 5 as insertion-ready errata"
      - text: "Path: `core-specs/async-services/OPC-UA-Async-Services.md`"
      - text: "Answers Mantis 10606"
      - text: "Open: final NodeIds, StatusCodes and clause numbers"
      - text: "No demo is listed for this draft"
    notes: |
      The source banner names OPC 10000-4 Services v1.05.07 and OPC 10000-5 Information Model v1.05.06 as the proposed additions. The status note says the combined document merges two insertion-ready errata: Part 4 Asynchronous Service Execution and Part 5 Asynchronous Service Model. It also says numeric NodeIds, StatusCode values and proposed clause numbers are provisional. The repository overview ties the draft to Mantis 10606, and the deck frontmatter does not list a demo. Present this as a small but important Service-layer correction: it generalizes a pattern OPC UA already uses privately for certificate pull management, but makes it available to any Service a Server advertises as deferrable.
