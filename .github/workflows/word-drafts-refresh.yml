# Keep the Word drafts in step with the markdown.
#
# Every `.docx` under `word-drafts/` is a build output. Until now nothing noticed when a
# specification changed and its rendering did not, so the two could drift apart silently
# for as long as nobody happened to rebuild.
#
# This rebuilds them on every push to `main` and collects the result on one standing pull
# request. The build is byte-reproducible, so a document whose sources did not change comes
# out identical and simply does not appear in the diff — no path filtering needed to work
# out what to regenerate.
#
# **It cannot finish them.** Resolving the table of contents and every cross-reference
# needs Microsoft Word, which a GitHub-hosted runner does not have, so the pull request
# opens as a *draft* and stays one until a maintainer has run
# `pwsh word-drafts/tools/finalize_all.ps1` locally and pushed. Verifying that they were
# finalised needs no Word, so this workflow does that itself and flips the pull request to
# ready for review when it passes.

name: Refresh Word drafts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: word-drafts-refresh
  cancel-in-progress: false

env:
  BRANCH: word-drafts/refresh

jobs:
  refresh:
    # A push made by this workflow must not start it again.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r word-drafts/tools/requirements.txt

      - name: Start from main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" origin/main

      - name: Rebuild every document
        id: build
        run: |
          set -o pipefail
          python word-drafts/tools/build_all.py 2>&1 | tee build.log | tail -20
          rm -f build.log

      - name: Commit only what actually changed
        id: commit
        run: |
          git add -A -- word-drafts
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'every document is already in step with its sources'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git diff --cached --name-only | sed 's/^/  /'
          {
            echo 'Regenerate the Word drafts'
            echo
            echo 'The specification sources changed, so the renderings did too. Rebuilt by'
            echo "\`build_all.py\` from ${GITHUB_SHA:0:12}."
            echo
            echo 'These documents are **not finalised**: the build writes fields, not field'
            echo 'results, and resolving them needs Microsoft Word. Run'
            echo '`pwsh word-drafts/tools/finalize_all.ps1` before merging.'
            echo
            echo 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
          } > .commit-message
          git commit -F .commit-message
          rm -f .commit-message
          git push --force-with-lease --set-upstream origin "$BRANCH"

      - name: Are they finalised?
        id: finalised
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Needs no Word: a finalised document carries one cached PAGEREF per contents
          # entry, and a freshly built one carries none.
          set +e
          pending=''
          for config in word-drafts/tools/specs/*.json; do
            case "$config" in *batch.json) continue ;; esac
            if ! python word-drafts/tools/validate_docx.py "$config" --finalized >/dev/null 2>&1; then
              pending="$pending $(basename "$config" .json)"
            fi
          done
          if [ -n "$pending" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "pending=$pending" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the standing pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          READY: ${{ steps.finalised.outputs.ready }}
          PENDING: ${{ steps.finalised.outputs.pending }}
        run: |
          {
            echo 'The Word drafts, rebuilt from the current specification sources.'
            echo
            echo 'This pull request stands open and is updated on every push to `main` that'
            echo 'changes a specification. It is how the renderings are kept from drifting'
            echo 'away from the markdown. When it is merged the branch goes away, and the'
            echo 'next change opens a fresh one.'
            echo
            echo '**Review `*.docmodel.json`, not the `.docx`** — a ZIP diff is unreadable,'
            echo 'and the docmodel is the intermediate representation each document was'
            echo 'rendered from.'
            echo
            if [ "$READY" = 'true' ]; then
              echo '### Finalised'
              echo
              echo 'Every document resolves its fields and opens with a populated contents'
              echo 'page. Ready to merge.'
            else
              echo '### Not finalised yet'
              echo
              echo 'The build writes fields, not field *results*: these documents currently'
              echo 'open with an empty contents page and blank cross-references. Resolving'
              echo 'them needs Microsoft Word, which a hosted runner does not have.'
              echo
              echo 'Before merging, run this locally and push:'
              echo
              echo '```powershell'
              echo 'git fetch origin && git checkout word-drafts/refresh'
              echo 'pwsh word-drafts/tools/finalize_all.ps1'
              echo 'git commit -am "Finalise the regenerated drafts" && git push'
              echo '```'
              echo
              echo 'Waiting on:'
              for spec in $PENDING; do echo "- \`$spec\`"; done
              echo
              echo 'This pull request is a draft until then, and becomes ready for review on'
              echo 'the next run once the check passes.'
            fi
          } > pr-body.md

          existing=$(gh pr list --head "$BRANCH" --base main --state open \
                       --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" --draft \
              --title 'Regenerate the Word drafts' --body-file pr-body.md
            existing=$(gh pr list --head "$BRANCH" --base main --state open \
                         --json number --jq '.[0].number // empty')
          else
            gh pr edit "$existing" --body-file pr-body.md
          fi
          rm -f pr-body.md

          if [ "$READY" = 'true' ]; then
            gh pr ready "$existing" || true
          fi
