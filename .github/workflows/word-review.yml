# Turn a marked-up Word document into a pull request.
#
# Open an issue, attach the reviewed .docx, and add the `word-review` label. The tracked
# changes become the pull request's diff and the comments become a review on it, then the
# issue gets a reply with the link. A reviewer never needs git, and never has to describe
# the same change twice.
#
# The work is split by what each half is good at. `ingest_docx.py` applies the tracked
# changes it can place *exactly* — same words, same file, same line — and refuses anything
# ambiguous. What is left over needs judgement rather than precision: a comment states a
# problem instead of a substitution, a mark may belong in the information model, an edit
# may be unplaceable because the prose was rewritten around it. That remainder goes to the
# coding agent, which is given the ingest's report rather than the document, so it cannot
# undo the exact edits that were already made.

name: Word review

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      url:
        description: URL of a reviewed .docx
        required: true
      issue:
        description: Issue number to reply to
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  copilot-requests: write

jobs:
  ingest:
    # A .docx is only ever ingested on purpose: the label is the consent.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'word-review'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.summary.outputs.branch }}
      needs_agent: ${{ steps.summary.outputs.needs_agent }}
      prompt: ${{ steps.summary.outputs.prompt }}
      spec: ${{ steps.summary.outputs.spec }}
      issue: ${{ steps.summary.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The reviewed document names the commit it was built from, and the ingest
          # reads the markdown as it was then. A shallow clone would not have it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r word-drafts/tools/requirements.txt

      - name: Find the attached document
        id: find
        env:
          BODY: ${{ github.event.issue.body }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re

          # Anyone can open an issue, so its body is untrusted and this URL ends up on a
          # command line. The character class is deliberately narrow — a quote or a
          # semicolon inside a matched URL would be a shell injection, and `\S` would
          # have allowed both.
          ATTACHMENT = re.compile(
              r'https://github\.com/user-attachments/files/[A-Za-z0-9/_.%-]+\.docx')

          url = (os.environ.get('INPUT_URL') or '').strip()
          if url and not ATTACHMENT.fullmatch(url):
              url = ''
          if not url:
              found = ATTACHMENT.findall(os.environ.get('BODY') or '')
              url = found[-1] if found else ''
          print('url=%s' % url)
          PY

      - name: Explain when there is nothing to ingest
        if: steps.find.outputs.url == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body \
            "I could not find a \`.docx\` attached to this issue. Drag the reviewed
            document into a comment, then add the \`word-review\` label again."
          exit 1

      - name: Download it
        env:
          URL: ${{ steps.find.outputs.url }}
        run: curl -sSL -o reviewed.docx "$URL"

      - name: Ingest, open the pull request and post the review
        id: ingest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python word-drafts/tools/ingest_docx.py reviewed.docx \
            --pr --base "${{ github.event.repository.default_branch }}" \
            --report ingest-report.md --emit ingest.json | tee ingest.log
          echo "url=$(grep -o 'https://github.com/[^\"]*/pull/[0-9]*' ingest.log | head -1)" \
            >> "$GITHUB_OUTPUT"

      - name: Work out what is left for the agent
        id: summary
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, uuid

          try:
              s = json.loads(pathlib.Path('ingest.json').read_text(encoding='utf-8'))
          except OSError:
              print('needs_agent=false')
              raise SystemExit

          report = pathlib.Path('ingest-report.md').read_text(encoding='utf-8')
          branch = s.get('branch') or 'review/%s/agent' % s['specId']

          print('spec=%s' % s['specId'])
          print('branch=%s' % branch)
          print('issue=%s' % (os.environ.get('ISSUE') or ''))
          print('needs_agent=%s' % ('true' if s.get('needsAgent') else 'false'))
          if not s.get('needsAgent'):
              raise SystemExit

          prompt = '''You are working in the opcua-drafts repository. Read
          `.github/copilot-instructions.md` first and follow it exactly.

          A reviewer marked up the generated Word rendering of the `%s` specification.
          Their tracked changes have **already been applied** to this branch by
          `ingest_docx.py`, mechanically and exactly. Do not repeat, revert or tidy them.

          What is left is the part that needed judgement, and it is all in the report
          below:

          - **Comments.** A comment states a problem or asks a question rather than
            supplying replacement text. Where a comment clearly asks for a change to the
            specification prose, make it. Where it asks a question, or where the answer is
            a judgement call about the model, do not guess — leave the text alone.
          - **Marks that were not applied.** Some could not be placed exactly; some belong
            in a different artifact entirely, and the report names which. A mark on a
            generated node table belongs in the generator that writes the NodeSet, never
            in the NodeSet and never in the rendering.

          ## The ingest report

          %s

          ## How to do it

          - Change the markdown specification, and the *generator* where the ask is about
            the information model. Never edit a generated NodeSet, CSV, `.docx`,
            `.docmodel.json` or `.provenance.json` — they are build outputs.
          - Keep every change traceable to something in the report. If nothing in the
            report asks for a change you can make confidently, make none: this branch
            already carries the reviewer's exact edits, and that is a complete and correct
            outcome on its own.
          - Keep `python .github/scripts/check_section_refs.py` clean.''' % (
              s['specId'], report)

          delim = 'EOF%s' % uuid.uuid4().hex
          print('prompt<<%s' % delim)
          print(prompt)
          print(delim)
          PY

      - name: Reply on the issue
        if: always() && github.event.issue.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          URL: ${{ steps.ingest.outputs.url }}
        run: |
          if [ -n "$URL" ]; then
            gh issue comment "$ISSUE" --body \
              "Opened $URL from the attached document. The tracked changes are applied; \
               anything that needed judgement is being looked at next."
          else
            gh issue comment "$ISSUE" --body-file ingest-report.md || \
            gh issue comment "$ISSUE" --body \
              "The ingest failed; see the workflow run for details."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-report
          path: ingest-report.md
          if-no-files-found: ignore

  refine:
    # Only the remainder, and only on the branch the ingest already built.
    needs: ingest
    if: needs.ingest.outputs.needs_agent == 'true'
    uses: ./.github/workflows/agent-task.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      copilot-requests: write
    with:
      branch: ${{ needs.ingest.outputs.branch }}
      base: main
      title: Review of ${{ needs.ingest.outputs.spec }} — comments and unplaced marks
      prompt: ${{ needs.ingest.outputs.prompt }}
      issue: ${{ needs.ingest.outputs.issue }}
      reuse-branch: true
